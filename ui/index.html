<!doctype html>
<html lang="en" data-view="machine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nix64</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <header id="top" aria-label="Nix64"></header>
  <main id="machine-view">
    <aside id="left" class="rail" aria-label="Machine"></aside>
    <section id="stage" aria-label="Screen"></section>
    <section id="dock" aria-label="Tools"></section>
    <aside id="right" class="rail" aria-label="Agent"></aside>
  </main>
  <main id="hub-view" hidden aria-label="Hub"></main>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="live-screen" class="sr-only" aria-live="off"></div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
